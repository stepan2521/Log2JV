# put this file to your resources folder
# or declare with a JVM-option:
#   -Dlog2jv.config=/etc/myapp/log2jv.properties

# TRACE, DEBUG, INFO, WARN, ERROR, OFF
logger.level=INFO

# console
console.enabled=true
console.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%level] %logger:%line - %msg%n

# file with the rotation
file.enabled=true
file.path=logs/app.log
file.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%level] %logger - %msg%ex%n
# 10 MB per file
file.maxSizeBytes=10485760
# сколько старых копий хранить (app.log.1 ... app.log.5)
file.maxBackups=5

# --- Асинхронная запись (снижает задержку в горячем пути приложения) ---
async.enabled=true
async.queueCapacity=1024
