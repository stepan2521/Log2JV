# Положите этот файл (переименованным по вкусу) в src/main/resources
# вашего проекта, который подключает log2jv — тогда он окажется
# на classpath и будет найден автоматически.
#
# Либо укажите произвольный путь через JVM-опцию:
#   -Dlog2jv.config=/etc/myapp/log2jv.properties

# Минимальный уровень: TRACE, DEBUG, INFO, WARN, ERROR, OFF
logger.level=INFO

# --- Консоль ---
console.enabled=true
console.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%level] %logger:%line - %msg%n

# --- Файл с ротацией по размеру ---
file.enabled=true
file.path=logs/app.log
file.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%level] %logger - %msg%ex%n
# 10 МБ на файл
file.maxSizeBytes=10485760
# сколько старых копий хранить (app.log.1 ... app.log.5)
file.maxBackups=5

# --- Асинхронная запись (снижает задержку в горячем пути приложения) ---
async.enabled=true
async.queueCapacity=1024
