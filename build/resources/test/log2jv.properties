# Minimal logging level: TRACE, DEBUG, INFO, WARN, ERROR, OFF
# Example: if you set this to INFO, levels before INFO won't be shown in the console.
logger.level=TRACE

console.enabled=true
console.colors=true
console.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%level] %source - %msg%n

file.enabled=true
file.path=logs/app.log
file.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%level] %logger - %msg%ex%n
file.maxSizeBytes=1048576
file.maxBackups=5

async.enabled=true
async.queueCapacity=1024
